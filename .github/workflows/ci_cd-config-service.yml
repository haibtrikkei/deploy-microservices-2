name: CI/CD - Config Service (GHCR)

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'config-service/**'
      - '.github/workflows/ci_cd-config-service.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'config-service/**'
      - '.github/workflows/ci_cd-config-service.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # GIAI ĐOẠN 0: KIỂM TRA THAY ĐỔI CODE
  # ========================================================
  check-changes:
    name: Check Config Service Changes
    runs-on: ubuntu-latest

    outputs:
      config-service: ${{ steps.filter.outputs.config-service }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            config-service:
              - 'config-service/**'
              - '.github/workflows/ci_cd-config-service.yml'
  # ========================================================
  # GIAI ĐOẠN 1: CI (Test, Build & Push Image lên GHCR)
  # ========================================================
  ci:
    name: Build, Test & Push to GHCR
    needs: check-changes
    if: |
      needs.check-changes.outputs.config-service == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x config-service/gradlew

      - name: Run Unit & Integration Tests
        working-directory: ./config-service
        run: ./gradlew test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Lowercase GHCR Image Name
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${OWNER_LC}/jb260310-ss8-config-service" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./config-service
          file: ./config-service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # GIAI ĐOẠN 2: CD (Kéo Image từ GHCR và Khởi chạy trên VPS)
  # ========================================================
  cd:
    name: Deploy to VPS
    needs: [ check-changes, ci ]
    if: |
      always() &&
      needs.check-changes.result == 'success' &&
      needs.ci.result == 'success' &&
      github.event_name != 'pull_request' &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Deploying Config Service to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "=========================================================="
            echo ">>> BẮT ĐẦU TRIỂN KHAI CONFIG SERVICE TRÊN VPS (GHCR PULL)"
            echo "=========================================================="

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || 'deploy-microservices-2' }}"

            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "[1/4] Thư mục $DEPLOY_PATH chưa tồn tại. Đang clone dự án..."
              git clone https://github.com/${{ github.repository }}.git "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"

            echo "[2/4] Đồng bộ file compose và cấu hình từ git..."
            git fetch origin main || git fetch origin master
            git reset --hard origin/main || git reset --hard origin/master

            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "[Auth] Đăng nhập GHCR trên VPS..."
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME || github.actor }}" --password-stdin
            fi

            echo "[3/4] Kéo image config-service mới nhất từ GHCR..."
            docker compose pull config-service

            echo "[4/4] Khởi chạy container tức thì (KHÔNG BUILD TRÊN VPS)..."
            docker compose up -d --no-build config-service

            echo "=========================================================="
            echo ">>> TRẠNG THÁI CONFIG SERVICE SAU KHI DEPLOY:"
            echo "=========================================================="
            docker compose ps config-service
            echo ">>> TRIỂN KHAI CONFIG SERVICE THÀNH CÔNG!"
