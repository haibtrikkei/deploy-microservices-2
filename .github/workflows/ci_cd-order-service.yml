name: CI/CD - Order Service (GHCR)

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'order-service/**'
      - '.github/workflows/ci_cd-order-service.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'order-service/**'
      - '.github/workflows/ci_cd-order-service.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # GIAI ĐOẠN 0: KIỂM TRA THAY ĐỔI CODE
  # ========================================================
  check-changes:
    name: Check Order Service Changes
    runs-on: ubuntu-latest

    outputs:
      order-service: ${{ steps.filter.outputs.order-service }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            order-service:
              - 'order-service/**'
              - '.github/workflows/ci_cd-order-service.yml'
  # ========================================================
  # GIAI ĐOẠN 1: CI (Test, Build & Push Image lên GHCR)
  # ========================================================
  ci:
    name: Build, Test & Push to GHCR
    needs: check-changes

    if: |
      needs.check-changes.outputs.order-service == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234$
          POSTGRES_DB: order_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d order_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x order-service/gradlew

      - name: Run Unit & Integration Tests
        working-directory: ./order-service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/order_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: 1234$
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
        run: ./gradlew test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Lowercase GHCR Image Name
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${OWNER_LC}/order-service" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          file: ./order-service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # GIAI ĐOẠN 2: CD (Kéo Image từ GHCR và Khởi chạy trên VPS)
  # ========================================================
  cd:
    name: Deploy to VPS
    needs: [ check-changes, ci ]
    if: |
      always() &&
      needs.check-changes.result == 'success' &&
      needs.ci.result == 'success' &&
      github.event_name != 'pull_request' &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Deploying Order Service to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "=========================================================="
            echo ">>> BẮT ĐẦU TRIỂN KHAI ORDER SERVICE TRÊN VPS (GHCR PULL)"
            echo "=========================================================="

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || 'deploy-microservices-1' }}"

            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "[1/4] Thư mục $DEPLOY_PATH chưa tồn tại. Đang clone dự án..."
              git clone https://github.com/${{ github.repository }}.git "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"

            echo "[2/4] Đồng bộ file compose và cấu hình từ git..."
            git fetch origin main || git fetch origin master
            git reset --hard origin/main || git reset --hard origin/master

            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "[Auth] Đăng nhập GHCR trên VPS..."
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME || github.actor }}" --password-stdin
            fi

            echo "[3/4] Kéo image order-service mới nhất từ GHCR..."
            docker compose pull order-service

            echo "[4/4] Khởi chạy container tức thì (KHÔNG BUILD TRÊN VPS)..."
            docker compose up -d --no-build order-service

#            echo "Dọn dẹp Docker images dangling..."
#            docker image prune -f

            echo "=========================================================="
            echo ">>> TRẠNG THÁI ORDER SERVICE SAU KHI DEPLOY:"
            echo "=========================================================="
            docker compose ps order-service
            echo ">>> TRIỂN KHAI ORDER SERVICE THÀNH CÔNG!"
