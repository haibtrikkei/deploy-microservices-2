name: CD - Infrastructure (Databases & Redis)

on:
  workflow_dispatch: # Khởi tạo hoặc cập nhật tầng database và cache thủ công

jobs:
  deploy-infra:
    name: Deploy Databases and Redis to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploying Databases and Redis to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "=========================================================="
            echo ">>> BẮT ĐẦU KHỞI TẠO TẦNG HẠ TẦNG (DATABASES & REDIS) TRÊN VPS"
            echo "=========================================================="

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || 'deploy-microservices-2' }}"

            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "[1/3] Thư mục $DEPLOY_PATH chưa tồn tại. Đang clone dự án..."
              git clone https://github.com/${{ github.repository }}.git "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"

            echo "[2/3] Đồng bộ file compose mới nhất từ git..."
            git fetch origin main || git fetch origin master
            git reset --hard origin/main || git reset --hard origin/master

            echo "[3/3] Khởi chạy các cơ sở dữ liệu và redis..."
            docker compose up -d user-db product-db order-db redis

            echo "=========================================================="
            echo ">>> TRẠNG THÁI HẠ TẦNG SAU KHI TRIỂN KHAI:"
            echo "=========================================================="
            docker compose ps user-db product-db order-db redis
            echo ">>> TRIỂN KHAI HẠ TẦNG HOÀN TẤT!"
